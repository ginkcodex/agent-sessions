# Builds installable packages and publishes them as a GitHub Release. The
# version is info.productVersion in wails.json, the one the app shows, and
# the release tag is v<version>.
#
# Releasing is merging a version bump into main: every push to main reads the
# version, and when tag v<version> does not exist yet, this builds, tests and
# publishes the release, which creates the tag on that commit. A push to main
# whose version already has a tag (a merge without a bump) stops after the
# version job. The tag is created with the workflow's token, which does not
# start another run of this workflow.
#
# Pushing a v<version> tag yourself still publishes, for pre-releases such as
# v1.2.0-beta.1 from develop. The tag must match wails.json, and a stable tag
# must point at a commit on main. Versions with a suffix publish as
# pre-releases. Manual runs (workflow_dispatch) build, verify and upload
# artifacts only, on any ref: the artifacts job adds the aggregate SHA256SUMS
# and the commit and run they came from.
#
# Each packaging job inspects what it built with packaging/**/verify-*.sh.
# Those checks are static apart from installing the .deb in a clean Ubuntu
# container and running the host's own remote server with `version`; the
# Windows packages are never installed or run here.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The Makefile runs the Wails v3 CLI (wails3 generate icons/syso) at the
# version go.mod pins, through go run; nothing else needs installing.
env:
  NODE_VERSION: '22'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # The release tag, v<version>.
      tag: ${{ steps.version.outputs.tag }}
      # 'true' when this run builds the packages (publishing or manual).
      build: ${{ steps.version.outputs.build }}
      # 'true' when this run publishes the release.
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: whether a commit is on main, and whether
          # the version's tag exists.
          fetch-depth: 0
      - id: version
        run: |
          version=$(jq -r '.info.productVersion // empty' wails.json)
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error file=wails.json::info.productVersion '$version' is not a semantic version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error file=wails.json::tag $GITHUB_REF_NAME does not match info.productVersion $version"
            exit 1
          fi
          # A stable release ships what was merged to main. Pre-release tags
          # (v1.2.0-beta.1) may point anywhere, such as develop.
          if [ "$GITHUB_REF_TYPE" = tag ] && [[ $GITHUB_REF_NAME != *-* ]] &&
             ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::stable tag $GITHUB_REF_NAME points at a commit that is not on main; merge develop into main and tag main"
            exit 1
          fi
          tag="v$version"
          case "$GITHUB_EVENT_NAME/$GITHUB_REF_TYPE" in
            push/tag)
              publish=true ;;
            push/branch)
              # A push to main publishes a version that has no tag yet. A tag
              # on this same commit means a re-run of its release, which
              # publishes again; a tag on another commit means the version
              # was not bumped, so there is nothing to release.
              tagged=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
              if [ -z "$tagged" ] || [ "$tagged" = "$GITHUB_SHA" ]; then
                publish=true
              else
                publish=false
                echo "::notice::$tag is already released; bump info.productVersion in wails.json to release this commit"
              fi ;;
            *)
              publish=false ;;
          esac
          build=$publish
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            build=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, tag $tag: build=$build publish=$publish"

  # The packaging jobs need test, so they are skipped with it when this run
  # does not build.
  test:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Windows installer compatibility unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            packaging/windows/appcompat-ca-test.c -o /tmp/appcompat-ca-test
          /tmp/appcompat-ca-test
      - name: Go tests
        run: go test -race ./...
      - name: Frontend type check and unit tests
        working-directory: frontend
        run: |
          npm run check
          npm test

  linux:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    # GTK 4 / WebKitGTK 6.0 need Ubuntu 24.04+, Debian 13+ or Fedora 40+.
    # Building on 24.04 keeps the glibc floor (2.39) within all of them.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install GTK 4 and WebKitGTK 6.0 headers
        # Azure's Ubuntu mirror can trickle at tens of KB/s; the action
        # avoids it, and the timeout fails the job if apt still stalls.
        timeout-minutes: 10
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev
      - run: npm ci
        working-directory: frontend
      - name: Build .deb and .rpm
        run: make package-linux VERSION=${{ needs.version.outputs.version }} ARCH=${{ matrix.arch }}
      - name: Check GTK 4 / WebKitGTK 6.0 linkage
        run: make check-gui-linkage
      - name: Install package inspection tools
        timeout-minutes: 10
        uses: ./.github/actions/apt-install
        with:
          packages: rpm libarchive-tools
      - name: Verify remote servers
        run: bash packaging/verify-remote-servers.sh --require-sums --run-host "$VERSION" build/remote
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - name: Verify .deb and .rpm metadata, dependencies and payload
        run: |
          bash packaging/linux/verify-packages.sh --binary build/bin/agent-sessions \
            --remote-sums build/remote/SHA256SUMS dist "$VERSION" "$ARCH"
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
      - name: Install .deb in a clean Ubuntu 24.04 container
        timeout-minutes: 20
        run: bash packaging/linux/verify-deb-install.sh dist/*.deb ubuntu:24.04
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # Developer ID signing and notarization use these repository secrets:
  #   MACOS_CERT_P12_BASE64  the "Developer ID Application" certificate and
  #                          its private key, exported as .p12, base64
  #   MACOS_CERT_PASSWORD    the .p12's export password
  #   APPLE_API_KEY_P8       App Store Connect API key (.p8 file contents)
  #   APPLE_API_KEY_ID       its Key ID
  #   APPLE_API_ISSUER       its Issuer ID
  # They live in a throwaway keychain for this job only, and only the steps
  # that need them see them. A run that publishes fails without them, so no
  # release ships an un-notarized .dmg. Manual runs without them build the
  # ad-hoc signed .dmg, as forks do.
  macos:
    needs: [version, test]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify macOS runtime icon
        # Native test checks the embedded Icon Composer tile and its background.
        run: go test -count=1 ./frontend -run '^TestAppIcon$'
      - name: Load the signing certificate and notary key
        env:
          PUBLISH: ${{ needs.version.outputs.publish }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$MACOS_CERT_PASSWORD" ] ||
             [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::a release needs the Developer ID secrets (MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER)"
              exit 1
            fi
            echo "::warning::Developer ID secrets not set: building an ad-hoc signed, un-notarized .dmg"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          # Keep the login keychain searchable after ours.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Lets codesign use the key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain" > /dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERT_P12_BASE64 holds no Developer ID Application identity"
            exit 1
          fi
          team=${identity##*(}
          team=${team%)}
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials agent-sessions-notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm -f "$RUNNER_TEMP/notary.p8"
          {
            echo "MACOS_SIGN_ID=$identity"
            echo "MACOS_TEAM_ID=$team"
            echo "MACOS_NOTARY_PROFILE=agent-sessions-notary"
            echo "MACOS_NOTARY_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
          echo "Signing as $identity"
      - name: Build universal .app and .dmg
        # package-macos generates the bundle icns from MACOS_APPICON, the same
        # Icon Composer export embedded by frontend/icon_darwin.go. With the
        # signing step's MACOS_SIGN_ID and MACOS_NOTARY_PROFILE it also signs,
        # notarizes and staples.
        timeout-minutes: 60
        run: make package-macos VERSION="$VERSION"
      - name: Verify universal app, Info.plist, signature, .dmg and servers
        timeout-minutes: 10
        run: |
          dmg="dist/agent-sessions_${VERSION}_macos_universal.dmg"
          if [ -n "${MACOS_TEAM_ID:-}" ]; then
            bash packaging/macos/verify-dmg.sh --developer-id "$MACOS_TEAM_ID" --notarized "$dmg" "$VERSION"
          else
            bash packaging/macos/verify-dmg.sh "$dmg" "$VERSION"
          fi
      - name: Remove the signing keychain
        if: always() && env.MACOS_NOTARY_KEYCHAIN != ''
        run: security delete-keychain "$MACOS_NOTARY_KEYCHAIN"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  # Go cross-compiles the Windows app and wixl builds the .msi on Linux,
  # so this reuses the Makefile's bash recipes unchanged. CI's
  # windows-test-build job covers the native Windows build and tests.
  # 24.04 for wixl 0.103: 22.04's 0.101 lacks AllowSameVersionUpgrades.
  windows:
    needs: [version, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Windows packaging tools
        timeout-minutes: 10
        uses: ./.github/actions/apt-install
        with:
          packages: wixl msitools gcc-mingw-w64-x86-64
      - run: npm ci
        working-directory: frontend
      - name: Build .msi and bundled setup.exe
        run: make package-windows VERSION=${{ needs.version.outputs.version }}
      - name: Inspect .msi and setup.exe (static; nothing is installed or run)
        run: |
          bash packaging/windows/verify-packages.sh --binary build/bin/agent-sessions.exe \
            --remote-sums build/remote/SHA256SUMS --conpty build/conpty \
            "dist/agent-sessions_${VERSION}_windows_amd64.msi" \
            "dist/agent-sessions_${VERSION}_windows_amd64_setup.exe" "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: |
            dist/*.msi
            dist/*_setup.exe
          if-no-files-found: error

  remote-servers:
    needs: [version, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build headless server bundles
        run: make remote-servers VERSION=${{ needs.version.outputs.version }}
      - name: Verify server bundles
        run: bash packaging/verify-remote-servers.sh --require-sums --run-host "$VERSION" build/remote
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: remote-servers
          path: build/remote/*
          if-no-files-found: error

  # Manual runs: one artifact with the whole verified set, its aggregate
  # SHA256SUMS and where it came from. Nothing is published.
  artifacts:
    if: github.event_name == 'workflow_dispatch'
    needs: [version, linux, macos, windows, remote-servers]
    runs-on: ubuntu-latest
    # Signs exactly as the release job does, so a manual run proves the
    # signing secrets work before anything is published.
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Install apt-ftparchive
        timeout-minutes: 10
        uses: ./src/.github/actions/apt-install
        with:
          packages: apt-utils
      - name: Write repo-meta.json
        # The Linux repositories' index entries for these packages
        # (docs/plan/linux-repos.md). Here rather than in the linux job, which
        # builds one architecture at a time.
        run: bash src/packaging/linux/repo-meta.sh "$VERSION" dist
      - name: Check the release set and write checksums
        run: bash src/packaging/release-checksums.sh dist "$VERSION"
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Sign SHA256SUMS
        # The app updates itself only from a release whose SHA256SUMS carries a
        # minisign signature (docs/plan/auto-update.md). The tool refuses a
        # signature the app's built-in keys would not accept, and a missing
        # key stops the release: an unsigned one would never reach installed
        # apps.
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        working-directory: src
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::error::MINISIGN_KEY is not set in the release environment."
            exit 1
          fi
          go run ./cmd/release-sign -version "$VERSION" ../dist/SHA256SUMS
          test -s ../dist/SHA256SUMS.minisig
      - name: Record provenance
        id: provenance
        run: |
          sums=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)
          jq -n --arg version "$VERSION" --arg sums "$sums" '{
              version: $version,
              repository: env.GITHUB_REPOSITORY,
              ref: env.GITHUB_REF,
              ref_type: env.GITHUB_REF_TYPE,
              commit: env.GITHUB_SHA,
              event: env.GITHUB_EVENT_NAME,
              workflow: env.GITHUB_WORKFLOW_REF,
              run_id: env.GITHUB_RUN_ID,
              run_attempt: env.GITHUB_RUN_ATTEMPT,
              run_url: "\(env.GITHUB_SERVER_URL)/\(env.GITHUB_REPOSITORY)/actions/runs/\(env.GITHUB_RUN_ID)",
              actor: env.GITHUB_ACTOR,
              sha256sums_sha256: $sums
            }' > dist/provenance.json
          cat dist/provenance.json
          echo "name=agent-sessions-$VERSION-${GITHUB_SHA::12}-run$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          {
            echo "### Agent Sessions $VERSION (not published)"
            echo
            echo "Commit \`$GITHUB_SHA\` on \`$GITHUB_REF\`, run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.provenance.outputs.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: needs.version.outputs.publish == 'true'
    needs: [version, linux, macos, windows, remote-servers]
    runs-on: ubuntu-latest
    # The signing key is a secret of this environment, which can be limited to
    # protected branches and tags (Settings > Environments).
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Sources for the check scripts only; the release is built from the
      # artifacts above.
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Install apt-ftparchive
        timeout-minutes: 10
        uses: ./src/.github/actions/apt-install
        with:
          packages: apt-utils
      - name: Write repo-meta.json
        # The Linux repositories' index entries for these packages
        # (docs/plan/linux-repos.md). Here rather than in the linux job, which
        # builds one architecture at a time.
        run: bash src/packaging/linux/repo-meta.sh "$VERSION" dist
      - name: Check the release set and write checksums
        # The servers' own SHA256SUMS is verified, then replaced by one over
        # every asset.
        run: bash src/packaging/release-checksums.sh dist "$VERSION"
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Sign SHA256SUMS
        # The app updates itself only from a release whose SHA256SUMS carries a
        # minisign signature (docs/plan/auto-update.md). The tool refuses a
        # signature the app's built-in keys would not accept, and a missing
        # key stops the release: an unsigned one would never reach installed
        # apps.
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        working-directory: src
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::error::MINISIGN_KEY is not set in the release environment."
            exit 1
          fi
          go run ./cmd/release-sign -version "$VERSION" ../dist/SHA256SUMS
          test -s ../dist/SHA256SUMS.minisig
      - name: Publish release
        run: |
          # Versions with a suffix (1.2.0-beta.1) publish as pre-releases and
          # never become "Latest".
          if [[ $TAG == *-* ]]; then
            channel=(--prerelease --latest=false)
          else
            channel=(--latest)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running the workflow for the same tag, or a draft left by an
            # earlier run: refresh its assets and publish.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --draft=false "${channel[@]}"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            # A pushed tag: release exactly that tag.
            gh release create "$TAG" dist/* --verify-tag \
              --title "Agent Sessions ${TAG#v}" --generate-notes "${channel[@]}"
          else
            # A push to main: creating the release creates the tag on the
            # commit that was built.
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "Agent Sessions ${TAG#v}" --generate-notes "${channel[@]}"
          fi

  # Arch Linux: agent-sessions-bin on the AUR repackages the .deb just
  # published. Stable releases only: a pacman version cannot hold a '-', and
  # the AUR follows the latest release. If it fails, the GitHub release stays
  # published; fix it and run the AUR workflow by hand.
  aur:
    if: needs.version.outputs.publish == 'true' && !contains(needs.version.outputs.version, '-')
    needs: [version, release]
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
