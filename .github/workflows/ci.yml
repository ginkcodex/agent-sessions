# Runs on every branch push and pull request: tests and frontend type check on
# Linux, Windows and macOS, and Linux and Windows desktop builds. Tag pushes
# are left to release.yml,
# which runs the checks before packaging (deb/rpm/dmg).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Windows installer compatibility DLL build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc -std=c11 -Wall -Wextra -Werror -O2 -shared \
            -o /tmp/appcompat-ca.dll packaging/windows/appcompat-ca.c -lmsi -ladvapi32
      - name: Windows installer compatibility unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined \
            packaging/windows/appcompat-ca-test.c -o /tmp/appcompat-ca-test
          /tmp/appcompat-ca-test
      - name: Go tests (including Windows setup state machine)
        run: go test -race ./...
      - name: Cross-build bundled Windows setup (fixture only; do not run)
        run: |
          printf 'CI compile fixture, not an MSI\n' > "$RUNNER_TEMP/setup-fixture.msi"
          bash packaging/windows/build-setup.sh "$RUNNER_TEMP/setup-fixture.msi" "$RUNNER_TEMP/setup-fixture.exe" 0.0.0
      - name: Frontend type check and unit tests
        working-directory: frontend
        run: |
          npm run check
          npm test

  windows-test-build:
    runs-on: windows-latest
    # pwsh only fails a step on its last command's exit code; bash -e fails on
    # any of them.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Go vet and tests
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Frontend type check, tests and build
        working-directory: frontend
        run: |
          npm run check
          npm test
          npm run build
      - name: Build Windows CLI, desktop and setup (do not run setup)
        run: |
          go build -trimpath -o build/bin/agent-sessions-cli.exe ./cmd/agent-sessions-cli
          go build -tags desktop,production -trimpath -ldflags "-H windowsgui" -o build/bin/agent-sessions.exe ./cmd/agent-sessions
          CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui" -o build/bin/agent-sessions-setup.exe ./packaging/windows/setup

  # The macOS terminal launcher (AppleScript, .app detection, zsh) is only
  # exercised for real here.
  macos-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Go vet and tests
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Frontend type check and unit tests
        working-directory: frontend
        run: |
          npm run check
          npm test

  linux-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install GTK and WebKitGTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
        working-directory: frontend
      - name: Build desktop binary
        run: make gui-build
