# nfpm config for the Linux .deb and .rpm packages; see `make package-linux`.
# VERSION and ARCH (a GOARCH value) come from the environment.
name: agent-sessions
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: devel
priority: optional
maintainer: ginkcode <ginkcode@gmail.com>
vendor: ginkcode
homepage: https://github.com/ginkcodex/agent-sessions
description: |-
  Desktop GUI to browse and manage agent coding sessions.
  Discovers, searches and manages sessions created by agentic coding
  tools (Claude Code, Codex CLI, OpenCode). Read-only by default.

contents:
  - src: build/bin/agent-sessions
    dst: /usr/bin/agent-sessions
    file_info:
      mode: 0755
  # Modes are explicit: the checkout's may be group-writable.
  - src: packaging/linux/io.github.ginkcode.AgentSessions.desktop
    dst: /usr/share/applications/io.github.ginkcode.AgentSessions.desktop
    file_info:
      mode: 0644
  - src: frontend/assets/Icon-universal.png
    dst: /usr/share/pixmaps/agent-sessions.png
    file_info:
      mode: 0644
  # Servers for every remote platform: the app deploys to the remote host's
  # OS/arch, not its own. With a glob src, dst is a directory.
  - src: build/remote/*.gz
    dst: /usr/lib/agent-sessions/remote/
    file_info:
      mode: 0644

# Runtime libraries of the Wails v3 GTK 4 / WebKitGTK 6.0 build. They exist
# on Ubuntu 24.04+, Debian 13+ and Fedora 40+; the binary is built on Ubuntu
# 24.04, so its glibc floor matches.
overrides:
  deb:
    depends:
      - libgtk-4-1
      - libwebkitgtk-6.0-4
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
